<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Top Up - Shikimori Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="back-btn">← Kembali</a>
    <div class="logo-text">SHIKIMORI STORE</div>
  </nav>

  <div class="order-container">
    <div class="game-banner-detail">
      <h1 id="gameTitle">Top Up Game</h1>
      <p>Masukkan data akun dan pilih nominal item.</p>
    </div>

    <!-- Step 1 -->
    <div class="section-box">
      <div class="step-header"><span class="step-num">1</span> Masukkan Data Akun</div>
      <div class="input-row">
        <input type="text" id="userId" placeholder="User ID">
        <input type="text" id="zoneId" placeholder="Zone / Server ID">
      </div>
    </div>

    <!-- Step 2 -->
    <div class="section-box">
      <div class="step-header"><span class="step-num">2</span> Pilih Nominal Item</div>
      <div class="nominal-grid" id="nominalGrid"></div>
    </div>

    <!-- Step 3 -->
    <div class="section-box">
      <div class="step-header"><span class="step-num">3</span> Pilih Pembayaran</div>
      <select id="paymentMethod" class="payment-select">
        <option value="NQ">QRIS (GoPay, OVO, Dana, ShopeePay, Bank)</option>
      </select>
    </div>

    <button class="pay-btn" onclick="processPayment()">Bayar Sekarang 🚀</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
