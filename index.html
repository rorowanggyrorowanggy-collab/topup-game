<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Top Up Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Toko Top Up Game</h1>

    <!-- Pilihan Game -->
    <div class="game-selector">
      <button class="game-btn active" onclick="switchGame('mlbb')">Mobile Legends</button>
      <button class="game-btn" onclick="switchGame('ff')">Free Fire</button>
      <button class="game-btn" onclick="switchGame('pubg')">PUBG Mobile</button>
    </div>

    <!-- Form Input Account -->
    <div class="section">
      <h3>1. Masukkan Data Akun</h3>
      <div class="input-group">
        <input type="text" id="userId" placeholder="User ID">
        <input type="text" id="zoneId" placeholder="Zone / Server ID (Jika Ada)">
      </div>
    </div>

    <!-- Pilihan Nominal Product -->
    <div class="section">
      <h3>2. Pilih Nominal</h3>
      <div class="nominal-grid" id="nominalGrid">
        <!-- Pilihan produk diisi otomatis oleh script.js -->
      </div>
    </div>

    <!-- Metode Pembayaran -->
    <div class="section">
      <h3>3. Pilih Pembayaran</h3>
      <select id="paymentMethod">
        <option value="NQ">QRIS (Semua E-Wallet & Bank)</option>
      </select>
    </div>

    <button class="pay-btn" onclick="processPayment()">Bayar Sekarang</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
