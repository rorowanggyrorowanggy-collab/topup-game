<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLP TOP UP - Store Top Up Resmi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body { background:#0b0f19; color:#f1f5f9; min-height:100vh; padding-bottom:50px; }

    /* HEADER & NAVBAR */
    header { background:#111827; border-bottom:1px solid #1f2937; position:sticky; top:0; z-index:100; }
    .nav-container { max-width:1100px; margin:0 auto; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    
    .brand { display:flex; align-items:center; gap:8px; text-decoration:none; }
    .brand-logo { width:36px; height:36px; border-radius:8px; object-fit:cover; border:1px solid #38bdf8; }
    .brand-title { font-size:1.05rem; font-weight:800; color:#38bdf8; letter-spacing:0.3px; }

    .search-box { flex:1; max-width:260px; }
    .search-box input { width:100%; padding:7px 12px; background:#0b0f19; border:1px solid #374151; border-radius:6px; color:#fff; font-size:0.8rem; outline:none; }

    .nav-actions { display:flex; gap:6px; align-items:center; }
    .btn { background:#1f2937; border:1px solid #374151; color:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:700; font-size:0.75rem; }
    .btn-primary { background:#2563eb; border:none; }

    /* CATEGORIES BAR */
    .cat-bar { max-width:1100px; margin:0 auto; padding:0 14px 8px 14px; display:flex; gap:6px; overflow-x:auto; }
    .cat-btn { background:transparent; border:none; color:#9ca3af; padding:5px 12px; cursor:pointer; font-weight:600; border-radius:6px; white-space:nowrap; font-size:0.8rem; }
    .cat-btn.active, .cat-btn:hover { background:#1f2937; color:#38bdf8; }

    .container { max-width:1100px; margin:12px auto; padding:0 14px; }

    /* HERO BANNER KOMPAK */
    .hero { 
      background: linear-gradient(135deg, #1e1b4b, #0f172a); 
      border-radius:12px; 
      padding:16px; 
      border:1px solid #1f2937; 
      margin-bottom:16px; 
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .hero-img { width: 56px; height: 56px; border-radius: 12px; border: 1.5px solid #38bdf8; object-fit: cover; }
    .hero-text { flex: 1; }
    .hero-badge { background:#2563eb; color:#fff; padding:2px 8px; border-radius:12px; font-size:0.65rem; font-weight:800; display:inline-block; margin-bottom:4px; }
    .hero h1 { font-size:1.1rem; font-weight:800; color:#fff; }
    .hero p { color:#9ca3af; font-size:0.75rem; }

    /* GRID PRODUK KECIL & KOMPAK (2 KOLOM DI HP) */
    .section-title { font-size:1rem; font-weight:800; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .game-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom:24px; }
    @media(min-width: 640px) { .game-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }

    .game-card { background:#111827; border:1px solid #1f2937; border-radius:10px; overflow:hidden; transition:transform 0.15s; }
    .game-card:active { transform:scale(0.98); }
    
    .poster-img { 
      height: 95px; 
      width: 100%; 
      object-fit: cover;
      display: block;
      background: #1f2937;
    }

    .card-body { padding:8px 10px; }
    .card-title { font-weight:700; font-size:0.78rem; margin-bottom:2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size:0.68rem; color:#6b7280; margin-bottom:8px; display:flex; justify-content:space-between; }
    .card-price { font-weight:800; color:#38bdf8; font-size:0.8rem; }
    .btn-card { width:100%; padding:6px; border:none; border-radius:6px; font-weight:700; font-size:0.72rem; cursor:pointer; background:#2563eb; color:#fff; }

    /* MODAL Checkout */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:200; justify-content:center; align-items:center; padding:14px; }
    .modal-box { background:#111827; border:1px solid #1f2937; border-radius:12px; width:100%; max-width:420px; padding:18px; position:relative; }
    .close-btn { position:absolute; top:10px; right:14px; font-size:1.2rem; cursor:pointer; color:#9ca3af; }
    .input-field { width:100%; padding:9px; background:#0b0f19; border:1px solid #374151; border-radius:6px; color:#fff; margin-bottom:10px; font-size:0.8rem; outline:none; }
    .pay-btn { width:100%; padding:11px; background:#10b981; border:none; color:#fff; font-weight:800; border-radius:8px; cursor:pointer; font-size:0.85rem; }

    footer { border-top:1px solid #1f2937; background:#111827; padding:16px; text-align:center; color:#6b7280; font-size:0.72rem; margin-top:20px; }
  </style>
</head>
<body>

  <!-- NAVBAR HEADER -->
  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <img src="logo.png" class="brand-logo" alt="PLP Logo" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'">
        <span class="brand-title">PLP TOP UP</span>
      </a>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari Game..." onkeyup="searchGames()">
      </div>

      <div class="nav-actions">
        <button class="btn btn-primary" onclick="openModal('authModal')">Login</button>
        <button class="btn" onclick="openModal('cartModal')">🛒 (<span id="cartCount">0</span>)</button>
      </div>
    </div>

    <div class="cat-bar">
      <button class="cat-btn active" onclick="filterCat('All')">Semua</button>
      <button class="cat-btn" onclick="filterCat('Mobile')">Mobile</button>
      <button class="cat-btn" onclick="filterCat('PC')">PC</button>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <img src="logo.png" class="hero-img" alt="PLP Project Logo" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'">
      <div class="hero-text">
        <span class="hero-badge">OFFICIAL STORE</span>
        <h1>PLP TOP UP Store</h1>
        <p>Top Up Game Instant & Murah 24 Jam.</p>
      </div>
    </div>

    <div class="section-title">
      <span>🔥 Katalog Top Up</span>
    </div>
    
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <!-- MODAL LOGIN -->
  <div id="authModal" class="modal">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
      <h4 style="margin-bottom:10px;">🔑 Login Akun PLP</h4>
      <input type="email" class="input-field" id="authEmail" placeholder="Masukkan Email Anda">
      <button class="pay-btn" onclick="handleInstantLogin()">Login Sesi</button>
    </div>
  </div>

  <!-- MODAL CART -->
  <div id="cartModal" class="modal">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
      <h4 style="margin-bottom:10px;">🛒 Checkout Top Up</h4>
      <div id="cartItems" style="margin-bottom:10px; font-size:0.8rem;"></div>
      <input type="text" class="input-field" id="targetUserId" placeholder="User ID Game (cth: 12345678)">
      <input type="text" class="input-field" id="targetZoneId" placeholder="Server ID (cth: 1234)">
      <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.85rem; margin-bottom:10px;">
        <span>Total:</span>
        <span id="cartTotal" style="color:#38bdf8;">Rp 0</span>
      </div>
      <button class="pay-btn" onclick="processCheckout()">Bayar Sekarang 🚀</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 PLP TOP UP Store.</p>
  </footer>

  <script>
    // KATALOG PRODUK DENGAN DIREKTORI WIKIMEDIA UNTUK POSTER STABLE
    const catalog = [
      { id: 'ML86', title: 'Mobile Legends 86 Diamond', type: 'Mobile', price: 20000, img: 'https://upload.wikimedia.org/wikipedia/en/thumb/9/91/Mobile_Legends_Bang_Bang_logo.png/500px-Mobile_Legends_Bang_Bang_logo.png' },
      { id: 'ML172', title: 'Mobile Legends 172 Diamond', type: 'Mobile', price: 40000, img: 'https://upload.wikimedia.org/wikipedia/en/thumb/9/91/Mobile_Legends_Bang_Bang_logo.png/500px-Mobile_Legends_Bang_Bang_logo.png' },
      { id: 'FF140', title: 'Free Fire 140 Diamond', type: 'Mobile', price: 19000, img: 'https://upload.wikimedia.org/wikipedia/en/thumb/3/30/Garena_Free_Fire_logo.png/500px-Garena_Free_Fire_logo.png' },
      { id: 'PUBG60', title: 'PUBG Mobile 60 UC', type: 'Mobile', price: 15000, img: 'https://upload.wikimedia.org/wikipedia/en/thumb/a/a2/PUBG_Mobile_logo.png/500px-PUBG_Mobile_logo.png' },
      { id: 'CP2077', title: 'Cyberpunk 2077', type: 'PC', price: 450000, img: 'https://cdn.cloudflare.steamstatic.com/steam/apps/1091500/header.jpg' },
      { id: 'RE4', title: 'Resident Evil 4', type: 'PC', price: 380000, img: 'https://cdn.cloudflare.steamstatic.com/steam/apps/2050650/header.jpg' }
    ];

    let currentUser = null;
    let cart = [];

    function renderCatalog(items) {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';
      items.forEach(item => {
        grid.innerHTML += `
          <div class="game-card">
            <img src="${item.img}" class="poster-img" alt="${item.title}">
            <div class="card-body">
              <div class="card-title" title="${item.title}">${item.title}</div>
              <div class="card-meta">
                <span>Resmi</span>
                <span class="card-price">Rp ${item.price.toLocaleString('id-ID')}</span>
              </div>
              <button class="btn-card" onclick="addToCart('${item.title}', ${item.price}, '${item.id}')">+ Beli</button>
            </div>
          </div>
        `;
      });
    }

    function handleInstantLogin() {
      const email = document.getElementById('authEmail').value.trim();
      if (!email) return alert('Masukkan Email!');
      currentUser = email;
      closeModal('authModal');
      alert('Berhasil Login!');
    }

    function addToCart(title, price, code) {
      if (!currentUser) return openModal('authModal');
      cart.push({ title, price, code });
      document.getElementById('cartCount').innerText = cart.length;
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cartItems');
      list.innerHTML = '';
      let total = 0;
      cart.forEach(i => {
        total += i.price;
        list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:4px 0;"><span>${i.title}</span><span>Rp ${i.price.toLocaleString('id-ID')}</span></div>`;
      });
      document.getElementById('cartTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function processCheckout() {
      if (cart.length === 0) return alert('Keranjang kosong!');
      alert('Pesanan berhasil dibuat!');
      cart = [];
      document.getElementById('cartCount').innerText = '0';
      closeModal('cartModal');
    }

    function filterCat(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'All') renderCatalog(catalog);
      else renderCatalog(catalog.filter(c => c.type === cat));
    }

    function searchGames() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderCatalog(catalog.filter(c => c.title.toLowerCase().includes(q)));
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    document.addEventListener('DOMContentLoaded', () => renderCatalog(catalog));
  </script>
</body>
</html>
